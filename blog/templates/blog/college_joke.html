{% extends 'blog/base.html' %}
{% load static %}

{% block title %}Узнать где учиться{% endblock %}

{% block content %}

<style>
/* Прячем шапку и футер для этой страницы */
body { background: #000 !important; margin: 0; padding: 0; }
header, .topbar, .site-footer { display: none !important; }

.joke-page {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    margin: 0;
    padding: 0;
}

.joke-page img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Растягивает на весь экран без искажений */
    display: block;
    box-shadow: none !important;
    border: none !important;
    border-radius: 0 !important;
}

.joke-text {
    position: absolute;
    bottom: 60px; /* Отступ от низа экрана */
    left: 0;
    right: 0;
    text-align: center;
    color: #ffffff; /* Белый цвет текста */
    font-size: 42px;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.9); /* Черная тень для читаемости */
    padding: 0 20px;
    letter-spacing: 1px;
}

@media (max-width: 700px) {
    .joke-text { font-size: 28px; bottom: 40px; }
}
</style>

<div class="joke-page">
    <!-- ТУТ МЫ УКАЗАЛИ НОВУЮ КАРТИНКУ -->
    <img src="{% static 'images/drive_joke.jpg' %}" alt="Колледж">
    <div class="joke-text">не нужен тебе этот колледж поверь мне</div>
</div>

{% endblock %}
