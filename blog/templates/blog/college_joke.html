{% extends 'blog/base.html' %}
{% load static %}

{% block title %}Узнать где учиться{% endblock %}

{% block content %}

<style>
/* Прячем родную шапку и футер */
body { background: #000 !important; margin: 0; padding: 0; }
.topbar, .site-header, .site-footer { display: none !important; }

/* Контейнер страницы */
.joke-page {
    min-height: 100vh;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 40px 20px;
    position: relative;
}

/* Наша новая кнопка "На главную" */
.btn-home {
    position: absolute;
    top: 30px;
    left: 30px;
    padding: 12px 24px;
    background: #c9a227;
    color: #0f1c33;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    transition: 0.3s;
    box-shadow: 0 4px 12px rgba(201,162,39,0.25);
    z-index: 100;
}
.btn-home:hover { background: #e0be4e; transform: translateY(-2px); }

/* Картинка */
.joke-img {
    max-width: 90%;
    max-height: 65vh; /* Ограничиваем высоту */
    border-radius: 16px;
    margin-bottom: 30px;
    box-shadow: none !important;
    object-fit: contain;
}

/* Текст под картинкой */
.joke-text {
    font-size: 42px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ffffff;
    margin: 0;
    text-align: center;
    text-shadow: none !important;
}

@media (max-width: 700px) {
    .joke-text { font-size: 26px; }
    .btn-home { top: 15px; left: 15px; padding: 10px 16px; font-size: 12px; }
}
</style>

<div class="joke-page">
    <!-- Кнопка на главную -->
    <a href="{% url 'home' %}" class="btn-home">На главную</a>
    
    <!-- Картинка (назови файл drive_joke.jpg или поменяй на .png) -->
    <img src="{% static 'images/drive_joke.jpg' %}" alt="Колледж" class="joke-img">
    
    <!-- Текст снизу -->
    <h1 class="joke-text">не нужен тебе этот колледж поверь мне</h1>
</div>

{% endblock %}
