{% extends 'blog/base.html' %}
{% load static %}

{% block title %}RuStore — ДГТУ{% endblock %}

{% block content %}

<style>
body { background: #000 !important; }
header, .topbar, .site-footer { display: none !important; }

.rustore-page {
    min-height: 100vh;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
}

.rustore-gif {
    width: 100%;
    max-width: 700px;
    border-radius: 16px;
    margin-bottom: 40px;
    box-shadow: none !important; 
}

.rustore-title {
    font-size: 64px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ffffff; 
    margin: 0;
    text-shadow: none !important; 
}

@media (max-width: 700px) {
    .rustore-title { font-size: 36px; }
    .rustore-gif { max-width: 100%; }
}
</style>

<div class="rustore-page">
    <img src="{% static 'images/rustore.gif' %}" alt="Топай отсюда" class="rustore-gif">
    <h1 class="rustore-title">Топай отсюда</h1>
</div>

{% endblock %}
